<!DOCTYPE html>
<html>
<head>
    <title>Test Add Candidate</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test Candidate Creation</h1>
    
    <button onclick="testAddCandidate()">Test Add Candidate</button>
    <button onclick="fetchCandidates()">Fetch All Candidates</button>
    <button onclick="fetchDepartments()">Fetch Departments</button>
    
    <div id="result"></div>

    <script>
        const BASE_URL = 'https://orygtvywltqgjgzchavf.supabase.co/functions/v1/make-server-f854c4f1';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yeWd0dnl3bHRxZ2pnemNoYXZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNTI5OTMsImV4cCI6MjA4MjcyODk5M30.9Sb7bRiG_FcnHF4qXNT92RMEV7YMG8IvRUiuhUPVcY8';

        async function testAddCandidate() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Testing candidate creation...</p>';

            try {
                // First get department ID
                const deptResponse = await fetch(`${BASE_URL}/departments`, {
                    headers: { 'Authorization': `Bearer ${ANON_KEY}` }
                });
                const departments = await deptResponse.json();
                const engineeringDept = departments.find(d => d.name === 'Engineering');

                if (!engineeringDept) {
                    resultDiv.innerHTML = '<p class="error">❌ Engineering department not found!</p>';
                    return;
                }

                // Create test candidate
                const candidateData = {
                    name: 'Test User ' + Date.now(),
                    department_id: engineeringDept.id,
                    title: 'Software Engineer',
                    location: 'Mumbai',
                    date_of_joining: '2024-01-15',
                    research_status: 'To be scheduled',
                    user_type: 'Builder',
                    features_tested: ['Workflow Builder'],
                    notes: 'Test candidate from API test',
                    current_user: 'Admin User'
                };

                const response = await fetch(`${BASE_URL}/candidates`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ANON_KEY}`
                    },
                    body: JSON.stringify(candidateData)
                });

                const result = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ SUCCESS! Candidate created!</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">❌ ERROR: ${result.error || 'Unknown error'}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ NETWORK ERROR: ${error.message}</p>
                `;
            }
        }

        async function fetchCandidates() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Fetching candidates...</p>';

            try {
                const response = await fetch(`${BASE_URL}/candidates`, {
                    headers: { 'Authorization': `Bearer ${ANON_KEY}` }
                });
                const data = await response.json();

                resultDiv.innerHTML = `
                    <p class="success">✅ Found ${data.length} candidate(s)</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ ERROR: ${error.message}</p>`;
            }
        }

        async function fetchDepartments() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Fetching departments...</p>';

            try {
                const response = await fetch(`${BASE_URL}/departments`, {
                    headers: { 'Authorization': `Bearer ${ANON_KEY}` }
                });
                const data = await response.json();

                resultDiv.innerHTML = `
                    <p class="success">✅ Found ${data.length} department(s)</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ ERROR: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
